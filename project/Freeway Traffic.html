<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tol Jakarta–Cikampek · Simulasi Lalu Lintas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#b9c8d3;font-family:var(--font-body, Archivo, sans-serif)}
  a{color:var(--color-text)}a:hover{color:var(--color-accent)}
  canvas{display:block;touch-action:none}
  #hud{position:fixed;left:16px;bottom:16px;background:var(--color-bg,#f3f2f2);color:var(--color-text,#201e1d);border:2px solid var(--color-text,#201e1d);
       width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px);display:flex;flex-direction:column}
  .hud-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 6px 6px 12px}
  #hud.open .hud-head{border-bottom:2px solid var(--color-text,#201e1d)}
  .kick{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  .kick b{color:var(--color-accent,#c0392b);font-weight:800}
  #toggle{font:inherit;font-size:12px;font-weight:600;background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2);border:0;padding:8px 14px;cursor:pointer;min-height:36px}
  #ctrl{display:none;overflow:auto;grid-template-columns:120px minmax(0,1fr)}
  #hud.open #ctrl{display:grid}
  .lbl{font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px 8px 12px;display:flex;align-items:center;border-bottom:1px solid var(--color-divider,#d8d6d5);text-wrap:pretty}
  .cell{padding:6px 8px 6px 0;border-bottom:1px solid var(--color-divider,#d8d6d5);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .opt{font:inherit;font-size:12px;background:transparent;color:inherit;border:1px solid currentColor;padding:5px 9px;cursor:pointer;min-height:30px}
  .opt[aria-pressed="true"]{background:var(--color-text,#201e1d);color:var(--color-bg,#f3f2f2)}
  .opt:disabled{opacity:.3;cursor:default}
  .hint{font-size:10px;opacity:.6;width:100%}
  @media (max-width:700px){
    #hud{left:0;right:0;bottom:0;width:auto;max-height:72vh;border-width:2px 0 0;padding-bottom:env(safe-area-inset-bottom)}
    .hud-head{padding:4px 4px 4px 14px}
    #toggle{min-height:44px;min-width:110px}
    .kick .long{display:none}
    #ctrl{grid-template-columns:1fr}
    .lbl{padding:10px 14px 2px;border:0}
    .cell{padding:4px 14px 10px}
    .opt{min-height:44px;flex:1 1 auto}
  }
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
  <div class="hud-head">
    <span class="kick"><b>Tol</b> Jakarta–Cikampek<span class="long"> · Lajur kiri</span></span>
    <button id="toggle">Kontrol</button>
  </div>
  <div id="ctrl"></div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

const MOBILE = matchMedia('(pointer:coarse)').matches || innerWidth < 700;
const T = 360, L = T*3, HALF = L/2, LW = 3.6, MED = 1.2, OVH = 7.5, OPEN_HW = 35;
const DEF = {cam:'overpass', dir:-1, lanes:5, den:1, tod:'day', closed:{'-1':[1], '1':[]}, cf:0, cfk:2, ovl:2};
let cfg; try { cfg = {...DEF, ...JSON.parse(localStorage.getItem('fw_cfg2') || '{}')}; } catch(e) { cfg = {...DEF}; }
const saveCfg = () => localStorage.setItem('fw_cfg2', JSON.stringify(cfg));
let LANES = cfg.lanes, span, roadW, NRX;
const wrap = z => ((z + HALF) % L + L) % L - HALF;
const mod = (a, n) => ((a % n) + n) % n;
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
// lane 0 = fast lane next to the median; negative lanes = contraflow lanes on the opposite carriageway
function posX(side, lx){ const c = MED + LW/2;
  if (lx >= 0) return side*(c + lx*LW);
  if (lx >= -1) return side*c*(1 + 2*lx);
  return -side*(c + (-lx-1)*LW); }
let W = 0;

const renderer = new THREE.WebGLRenderer({antialias:!MOBILE, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xb9c8d3, 120, 420);
scene.background = new THREE.Color(0xb9c8d3);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 1200);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI*0.48; controls.enabled = false;

const hemi = new THREE.HemisphereLight(0xdfeaf5, 0x55603a, 1.1); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.4);
sun.castShadow = true; const sm = MOBILE ? 1024 : 2048; sun.shadow.mapSize.set(sm, sm);
Object.assign(sun.shadow.camera, {left:-90,right:90,top:90,bottom:-90,near:1,far:400});
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.2, 0.5, 0.9);
composer.addPass(bloom); composer.addPass(new OutputPass());

// ---------- curved road (vertex-shader bend, straight at the camera) ----------
const CU = {uW:{value:0}, uCz:{value:0}, uB0:{value:0}, uB1:{value:0}};
const gC = u => 45*Math.sin(u/450) + 20*Math.sin(u/200+1.3);
const gD = u => 45/450*Math.cos(u/450) + 20/200*Math.cos(u/200+1.3);
const BEND_HEAD = 'uniform float uW; uniform float uCz; uniform float uB0; uniform float uB1;\nfloat bendX(float z){ return 45.0*sin((uW - z)/450.0) + 20.0*sin((uW - z)/200.0 + 1.3) - uB0 - uB1*(z - uCz); }\n';
const BEND_CHUNK = THREE.ShaderChunk.project_vertex.replace('mvPosition = modelViewMatrix * mvPosition;',
  'vec4 bwp = modelMatrix * mvPosition; bwp.x += bendX(bwp.z); mvPosition = viewMatrix * bwp;');
const WORLD_CHUNK = '#include <worldpos_vertex>\n#if defined( USE_ENVMAP ) || defined( DISTANCE ) || defined ( USE_SHADOWMAP ) || defined ( USE_TRANSMISSION ) || NUM_SPOT_LIGHT_COORDS > 0\nworldPosition.x += bendX(worldPosition.z);\n#endif';
function patchMat(m){ if (!m || m.userData.bent) return; m.userData.bent = true;
  m.onBeforeCompile = sh => { Object.assign(sh.uniforms, CU);
    sh.vertexShader = BEND_HEAD + sh.vertexShader.replace('#include <project_vertex>', BEND_CHUNK).replace('#include <worldpos_vertex>', WORLD_CHUNK); };
  m.needsUpdate = true; }
const depthMat = new THREE.MeshDepthMaterial({depthPacking: THREE.RGBADepthPacking}); patchMat(depthMat);
const bendAt = z => gC(W - z) - CU.uB0.value - CU.uB1.value*(z - CU.uCz.value);
function bendAll(){ scene.traverse(o => { if (!o.isMesh) return; o.frustumCulled = false; (Array.isArray(o.material) ? o.material : [o.material]).forEach(patchMat); if (o.castShadow) o.customDepthMaterial = depthMat; }); }
function updateBend(){ const cz = camera.position.z; CU.uW.value = W; CU.uCz.value = cz; CU.uB0.value = gC(W - cz); CU.uB1.value = -gD(W - cz); }

const M = (c, o={}) => new THREE.MeshStandardMaterial({color:c, roughness:0.9, ...o});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000, 1, 300), M(0x6f8a4a));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.05; ground.receiveShadow = true; scene.add(ground);

const asphalt = M(0x3b3d40, {roughness:0.95});
const concrete = M(0xa9a59c);
const white = new THREE.MeshBasicMaterial({color:0xe9e7df});
const railMat = M(0x9aa1a6, {metalness:0.6, roughness:0.4});
const lampMat = M(0x8c9196, {metalness:0.5, roughness:0.5});
const lampHeadMat = new THREE.MeshStandardMaterial({color:0x222222, emissive:0xffc98a, emissiveIntensity:0});
const signBackMat = M(0x8f969b, {metalness:0.4, roughness:0.5});
const grassBank = M(0x7d8a55);
const tm = new THREE.Matrix4();

const segs = d => d > 40 ? Math.ceil(d/6) : 1;
function flat(w, d, mat, x, y, z){ const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d, 1, segs(d)), mat); m.rotation.x = -Math.PI/2; m.position.set(x,y,z); m.receiveShadow = true; return m; }
function solid(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d,1,1,segs(d)), mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; return m; }
function dispose(g){ g.traverse(o => { if (o.geometry && !o.geometry.userData.keep) o.geometry.dispose(); if (o.material && o.material.map && !o.material.map.userData.keep) o.material.map.dispose(); }); if (g.parent) g.parent.remove(g); }
function instanced(geo, mat, pts, y=0){ const m = new THREE.InstancedMesh(geo, mat, Math.max(1, pts.length)); m.count = pts.length;
  pts.forEach(([x,z], i) => { tm.makeTranslation(x, y, z); m.setMatrixAt(i, tm); }); return m; }

// ---------- traffic signs (rambu) ----------
const MATC = new Map();
function signMat(key, w, h, draw, px=256){ if (!MATC.has(key)) { const c = document.createElement('canvas'); c.width = px; c.height = Math.round(px*h/w);
  draw(c.getContext('2d'), c.width, c.height); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.userData.keep = true;
  const m = new THREE.MeshStandardMaterial({map:t, emissive:0xffffff, emissiveMap:t, emissiveIntensity:signI, roughness:0.6}); m.userData.sign = true; MATC.set(key, m); } return MATC.get(key); }
const drawSpeed = (n, min) => (x, w) => { const r = w/2; x.beginPath(); x.arc(r,r,r-2,0,Math.PI*2); x.fillStyle = min ? '#1d4fa3' : '#fff'; x.fill();
  x.lineWidth = min ? 6 : w*0.11; x.strokeStyle = min ? '#fff' : '#d0202a'; x.beginPath(); x.arc(r,r, min ? r-12 : r-2-w*0.055, 0, Math.PI*2); x.stroke();
  x.fillStyle = min ? '#fff' : '#111'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.font = `800 ${n >= 100 ? w*0.36 : w*0.44}px Archivo, sans-serif`; x.fillText(String(n), r, r + w*0.02); };
const drawNoU = (x, w) => { const r = w/2; x.beginPath(); x.arc(r,r,r-2,0,Math.PI*2); x.fillStyle = '#fff'; x.fill();
  x.lineWidth = w*0.07; x.strokeStyle = '#111'; x.beginPath(); x.moveTo(r+w*0.12, r+w*0.24); x.lineTo(r+w*0.12, r-w*0.02); x.arc(r, r-w*0.02, w*0.12, 0, Math.PI, true); x.lineTo(r-w*0.12, r+w*0.1); x.stroke();
  x.fillStyle = '#111'; x.beginPath(); x.moveTo(r-w*0.21, r+w*0.08); x.lineTo(r-w*0.03, r+w*0.08); x.lineTo(r-w*0.12, r+w*0.24); x.closePath(); x.fill();
  x.lineWidth = w*0.11; x.strokeStyle = '#d0202a'; x.beginPath(); x.arc(r,r,r-2-w*0.055,0,Math.PI*2); x.stroke();
  x.lineWidth = w*0.08; x.beginPath(); x.moveTo(r - r*0.62, r - r*0.62); x.lineTo(r + r*0.62, r + r*0.62); x.stroke(); };
const drawPlate = (lines, bg, fg) => (x, w, h) => { x.fillStyle = bg; x.fillRect(0,0,w,h); x.strokeStyle = fg; x.lineWidth = 8; x.strokeRect(10,10,w-20,h-20);
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle'; const lh = (h-30)/lines.length;
  lines.forEach((t, i) => { fit(x, t, w-50, lh*0.8, 700); x.fillText(t, w/2, 15 + lh*(i+0.5)); }); };
const SP = n => ({d:0.9, m: signMat('sp'+n, 1, 1, drawSpeed(n, false))});
const MN = n => ({d:0.75, m: signMat('mn'+n, 1, 1, drawSpeed(n, true))});
const NU = () => ({d:0.9, m: signMat('nu', 1, 1, drawNoU)});
const PL = (lines, bg='#fff', fg='#111', w=1.4, h=0.55) => ({w, h, m: signMat('pl'+lines.join('|')+bg+w+h, w, h, drawPlate(lines, bg, fg), 512)});
const discGeo = new THREE.CircleGeometry(0.5, 32); discGeo.userData.keep = true;
const backDiscGeo = discGeo.clone(); backDiscGeo.rotateY(Math.PI); backDiscGeo.translate(0, 0, -0.02); backDiscGeo.userData.keep = true;
const postGeoS = new THREE.BoxGeometry(0.09, 1, 0.09); postGeoS.translate(0, 0.5, 0); postGeoS.userData.keep = true;
const PGC = new Map(); const pgeo = (w,h) => { const k = w+'|'+h; if (!PGC.has(k)) { const g = new THREE.PlaneGeometry(w,h); g.userData.keep = true; PGC.set(k, g); } return PGC.get(k); };
function signPost(parent, x, z, rot, items, y0=0, sc=1){
  const g = new THREE.Group(); g.position.set(x, y0, z); g.rotation.y = rot; g.scale.setScalar(sc);
  let y = 1.9; const placed = [];
  for (let i = items.length-1; i >= 0; i--) { const h = items[i].d || items[i].h; placed.push([items[i], y + h/2]); y += h + 0.08; }
  const post = new THREE.Mesh(postGeoS, signBackMat); post.scale.y = y - 0.08; post.position.z = -0.07; post.castShadow = true; g.add(post);
  for (const [it, cy] of placed) {
    if (it.d) { const f = new THREE.Mesh(discGeo, it.m), b = new THREE.Mesh(backDiscGeo, signBackMat); f.scale.setScalar(it.d); b.scale.setScalar(it.d); f.position.y = b.position.y = cy; g.add(f, b); }
    else { const f = new THREE.Mesh(pgeo(it.w, it.h), it.m), b = new THREE.Mesh(pgeo(it.w, it.h), signBackMat); f.position.y = cy; b.rotation.y = Math.PI; b.position.set(0, cy, -0.02); g.add(f, b); }
  }
  parent.add(g); return g;
}

// ---------- periodic world (period T) ----------
let world, lampPos = [], gates = null, uturnG = null, OVC = 0, OVS = 600;
const Z0 = -1080, Z1 = 1080, LEN = Z1 - Z0;
const ovDir = i => i < Math.ceil(cfg.ovl/2) ? 1 : -1;            // overpass lane heading along x (left-hand traffic)
const ovZ = i => (i - (cfg.ovl-1)/2) * 3.5;
function buildWorld(){
  if (world) dispose(world);
  world = new THREE.Group(); scene.add(world);
  span = LANES*LW; roadW = MED + span + 3; NRX = -(roadW + ND);
  const add = (...o) => world.add(...o);
  for (const s of [-1,1]) {
    add(flat(roadW - MED + 0.2, LEN, asphalt, s*(MED + (roadW-MED)/2), 0, 0));
    add(flat(4, LEN, M(0x8b8a7c), s*(roadW+2), 0.005, 0));
    add(flat(0.15, LEN, white, s*(MED+0.2), 0.012, 0));
  }
  add(flat(MED*2, LEN, M(0x55574f), 0, 0.003, 0));
  // median barrier with U-turn openings (putaran balik) halfway between bridges
  const barMat = M(0xb8b4aa);
  for (let r=-3; r<=3; r++) add(solid(0.6, 0.9, T - 2*OPEN_HW, barMat, 0, 0.45, r*T));
  const gp = [];
  for (let r=-3; r<=2; r++) for (let z=-OPEN_HW+0.6; z<OPEN_HW-0.5; z+=1.15) gp.push([0, r*T + T/2 + z]);
  gates = instanced(new THREE.BoxGeometry(0.6, 0.85, 1.05), new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.6}), gp, 0.425);
  const cA = new THREE.Color(0xf05a14), cB = new THREE.Color(0xf2f2f2);
  gp.forEach((_, i) => gates.setColorAt(i, i%2 ? cA : cB)); gates.castShadow = true; gates.visible = !cf.on; add(gates);

  const dashGeo = new THREE.PlaneGeometry(0.15, 3); dashGeo.rotateX(-Math.PI/2);
  const dp = [];
  for (const s of [-1,1]) for (let l=1; l<LANES; l++) for (let z=Z0; z<Z1; z+=9) dp.push([s*(MED+l*LW), z]);
  add(instanced(dashGeo, white, dp, 0.012));

  // median lamps (none inside the openings)
  const poleGeo = new THREE.CylinderGeometry(0.12,0.16,11,8); poleGeo.translate(0,5.5,0);
  const armGeo = new THREE.BoxGeometry(6, 0.14, 0.14); armGeo.translate(0,10.9,0);
  const lz = []; for (let n=0; n<LEN/T; n++) for (const off of [22,67,112,247,292,337]) lz.push(Z0 + n*T + off);
  const poles = instanced(poleGeo, lampMat, lz.map(z => [0,z])), arms = instanced(armGeo, lampMat, lz.map(z => [0,z]));
  const hp = []; lampPos = [];
  lz.forEach(z => { for (const s of [-1,1]) { hp.push([s*2.8, z]); lampPos.push({x:s*4, z}); } });
  const heads = instanced(new THREE.BoxGeometry(0.9,0.18,0.4), lampHeadMat, hp, 10.8);
  poles.castShadow = true; add(poles, arms, heads);

  // toll signs: max 100, min 60, heavy vehicles keep left; no U-turn at median openings
  const eT = MED + span;
  uturnG = new THREE.Group(); add(uturnG);
  for (let r=-3; r<=3; r++) for (const s of [-1,1]) {
    signPost(world, s*(eT+4.2), s*140 + r*T, s<0 ? 0 : Math.PI, [SP(100), MN(60), PL(['Kendaraan berat', 'lajur kiri'], '#fff', '#111', 1.5, 0.6)], 0, 1.5);
    signPost(world, NRX + s*9.5, r*T - s*90, s<0 ? 0 : Math.PI, [SP(60), PL(['Sepeda motor', 'lajur kiri'], '#1d4fa3', '#fff', 1.3, 0.55)]);
    if (r < 3) signPost(uturnG, 0, r*T + T/2 - s*(OPEN_HW + 3), s<0 ? 0 : Math.PI, [NU(), PL(['Khusus', 'petugas'], '#fff', '#111', 1, 0.5)], 0.9, 1.2);
  }
  uturnG.visible = !cf.on;

  // national road (Jalan Nasional, 4 lajur) parallel on the west side
  add(flat(17, LEN, asphalt, NRX, 0.004, 0));
  for (const s of [-1,1]) { add(flat(3, LEN, M(0x9a8d6e), NRX + s*10, 0.003, 0)); add(flat(0.15, LEN, white, NRX + s*7.2, 0.012, 0)); add(flat(0.12, LEN, white, NRX + s*0.15, 0.012, 0)); }
  const np = []; for (const s of [-1,1]) for (let z=Z0; z<Z1; z+=8) np.push([NRX + s*3.5, z]);
  const nGeo = new THREE.PlaneGeometry(0.12, 3); nGeo.rotateX(-Math.PI/2); add(instanced(nGeo, white, np, 0.012));

  // trees
  const perT = MOBILE ? 110 : 200, pattern = [];
  while (pattern.length < perT) { const z = rnd(-T/2, T/2); if (Math.abs(z) < 16) continue;
    const s = Math.random()<.5?-1:1, ax = s<0 && Math.random()<.75 ? rnd(roadW+ND+16, roadW+ND+130) : rnd(roadW+8, roadW+140);
    if (s<0 && ax < roadW+ND+14 && !(ax > roadW+70 && ax < roadW+ND-10 && z > 16 && z < 110)) continue;
    if (s>0 && (ax < roadW+80 || Math.abs(Math.abs(z)-180) < 16)) continue;
    if (s>0 && ax < roadW+175 && (z > 95 || z < -15)) continue;
    pattern.push({x:s*ax, z, k:rnd(0.7,1.5), h:rnd(.85,1.25), r:rnd(0,6.28)}); }
  const trunkGeo = new THREE.CylinderGeometry(0.2,0.3,2,6); trunkGeo.translate(0,1,0);
  const crownGeo = new THREE.ConeGeometry(2.2,6,7); crownGeo.translate(0,4.8,0);
  const blobGeo = new THREE.IcosahedronGeometry(2.6,0); blobGeo.translate(0,4,0);
  const n = perT*7;
  const trunks = new THREE.InstancedMesh(trunkGeo, M(0x5a4330), n);
  const crowns = new THREE.InstancedMesh(crownGeo, M(0x3f5f34), Math.ceil(n/2));
  const blobs = new THREE.InstancedMesh(blobGeo, M(0x587a3a, {flatShading:true}), Math.ceil(n/2));
  const q = new THREE.Quaternion(), sc = new THREE.Vector3(), pv = new THREE.Vector3(), up = new THREE.Vector3(0,1,0);
  let i = 0;
  for (let r=-3; r<=3; r++) for (const p of pattern) {
    pv.set(p.x, 0, p.z + r*T); sc.set(p.k, p.k*p.h, p.k); q.setFromAxisAngle(up, p.r); tm.compose(pv,q,sc);
    trunks.setMatrixAt(i, tm); (i%2 ? crowns : blobs).setMatrixAt(i>>1, tm); i++;
  }
  for (const m of [trunks,crowns,blobs]) { m.castShadow = true; add(m); }

  // overpasses: jalan raya with 1–4 lanes, spanning the toll road and the national road
  const ovl = cfg.ovl, dw = ovl*3.5 + 2.4, xL = NRX - 18, xR = roadW+8, bankW = 260, rl = xR - xL + 2*bankW, rc = (xL+xR)/2;
  OVC = rc; OVS = rl - 40;
  const bd = [], bGeo = new THREE.PlaneGeometry(3, 0.15); bGeo.rotateX(-Math.PI/2);
  for (let r=-3; r<=3; r++) {
    const z = r*T;
    add(solid(xR-xL, 1.2, dw, concrete, rc, OVH, z));

const WS = {'-1':650, '1':650}, ZONE = 200, TAPER = 60, STOP = {vel:0};

}

function closedBlocks(d){

    else if (v.kind === 'fly') { v.p += v.vel*dt; const m = mod(v.p, 660); v.g.position.set(v.dx > 0 ? -330 + m : 330 - m, 14.71, fz + v.zz); }
    else { v.p += v.vel*dt; const m = mod(v.p, v.span); v.g.position.x = OVC + (v.dx > 0 ? -v.span/2 + m : v.span/2 - m); }
    for (const w of v.wh) w.rotation.x += v.vel*dt / v.r;
  }
  for (const v of conv) { locals.splice(locals.indexOf(v), 1); const n = perN(v.s), f = facOf(-1, tileK(-1, n));
    v.rp = {P: mkPath(facPath(f, uOf(v.s))), d: 0, i: 0, sBase: HALF + n*T, end: 'merge', f}; v.q = pathAt(v.rp.P, 0, 0); rampers.push(v); pend.w--; }
}
function place(){
  const cz = camera.position.z;
  for (const v of vehicles){
    const z = wrap(v.dir*(v.s - HALF) + W);
    v.g.position.set(v.x, 0, z);
    v.g.rotation.y = (v.dir===-1 ? Math.PI : 0) + v.yaw * v.dir;
    v.g.visible = Math.abs(z - cz) < 470;
  }
  for (const v of rampers){ const q = v.q; if (!q) continue;
    const z = wrap(v.dir*(v.rp.sBase + q.u - HALF) + W);
    v.g.position.set(v.x ?? v.dir*(MED + span + q.o), q.h || 0, z); v.g.rotation.y = Math.atan2(v.dir*q.ho, v.dir*q.hu); v.g.visible = Math.abs(z - cz) < 470; }
  for (const g of zones){ const {dir, s0, mid} = g.userData;
    const zc = wrap(dir*(s0 + mid - HALF) + W); g.position.z = zc - dir*mid; g.rotation.y = dir===-1 ? Math.PI : 0; }
}

// ---------- time of day ----------
const TOD = {
  day:  {sky:0xb9c8d3, fog:[200,620], hemi:1.1, sun:2.4, sunCol:0xfff1dc, sunPos:[60,90,40], head:0.15, tail:0.3, lamp:0, bloom:0.15, exp:1.0, sign:0.12},
  dusk: {sky:0xd79a7a, fog:[90,380],  hemi:0.55, sun:1.6, sunCol:0xff9a5a, sunPos:[-120,25,-160], head:2, tail:1.5, lamp:1.2, bloom:0.55, exp:0.95, sign:0.35},
  night:{sky:0x0d1420, fog:[60,320],  hemi:0.12, sun:0.18, sunCol:0x8aa0ff, sunPos:[40,90,60], head:5, tail:3, lamp:4, bloom:1.0, exp:1.1, sign:0.55},
};
const sunOff = new THREE.Vector3(60,90,40);
const lampLights = [];
for (let i=0;i<(MOBILE?4:6);i++){ const p = new THREE.PointLight(0xffc98a, 0, 40, 1.6); scene.add(p); lampLights.push(p); }
let lampI = 0, signI = 0.12;
function setTod(k){
  const t = TOD[k]; scene.background.set(t.sky); scene.fog.color.set(t.sky); scene.fog.near=t.fog[0]; scene.fog.far=t.fog[1];
  hemi.intensity=t.hemi; sun.intensity=t.sun; sun.color.set(t.sunCol); sunOff.set(...t.sunPos);
  headMat.emissiveIntensity=t.head; tailMat.emissiveIntensity=t.tail; lampHeadMat.emissiveIntensity=t.lamp; lampI = t.lamp*60;
  bloom.strength = MOBILE ? t.bloom*0.7 : t.bloom; renderer.toneMappingExposure=t.exp; signI = t.sign; applySign();
  ground.material.color.set(k==='night'?0x2c3a24:0x6f8a4a);
}
function applySign(){ scene.traverse(o => { if (o.material && o.material.userData && o.material.userData.sign) o.material.emissiveIntensity = signI; }); }

// ---------- cameras ----------
let camMode = 'overpass', chaseCar = null, prevS = 0, clock = 0;
function setCam(m){
  camMode = m; const d = cfg.dir;
  controls.enabled = m==='orbit'; controls.autoRotate = m==='orbit'; controls.autoRotateSpeed = 0.4;
  if (m==='overpass' || m==='works' || m==='ic') W = Math.round(W / L) * L;
  if (m==='orbit'){ camera.position.set(-60, 40, -d*80); controls.target.set(0,0,0); }
  if (m==='chase'){
    let pool = vehicles.filter(v => v.dir===d && (v.type==='car'||v.type==='suv'));
    if (!pool.length) pool = vehicles.filter(v => v.dir===d);
    chaseCar = pool.length ? pick(pool) : null;
    if (chaseCar) { prevS = chaseCar.s; W -= wrap(d*(chaseCar.s - HALF) + W); camera.position.set(chaseCar.x - d*1.5, 4.2, -d*13); }
  }
}
function fovFor(base){ const a = camera.aspect; return a < 1.3 ? Math.min(70, 2*Math.atan(Math.tan(base*Math.PI/360)*1.3/a)*180/Math.PI) : base; }
const tmpV = new THREE.Vector3(), focus = new THREE.Vector3();
function updateCam(dt){
  clock += dt; const d = cfg.dir;
  if (camMode === 'chase' && chaseCar && chaseCar.dead) setCam('chase');
  if (camMode==='works'){
    const zs = WS[d] - HALF, ox = MED + span;
    camera.position.set(d*(ox + 3.5), 3.6, d*(zs - 12)); camera.lookAt(d*(ox - span*0.45), 0.5, d*(zs + 70)); camera.fov = fovFor(58);
  } else if (camMode==='ic'){
    const cx = d*(MED + span + 75), cz = d*170, a = clock*0.06, r = camera.aspect < 1 ? 210 : 170;
    camera.position.set(cx + r*Math.cos(a), camera.aspect < 1 ? 190 : 130, cz + r*Math.sin(a)); camera.lookAt(cx, 0, cz); camera.fov = fovFor(50);
  } else if (camMode==='overpass'){
    const x = posX(d, (LANES-1)/2), ez = d*((cfg.ovl*3.5 + 2.4)/2 + 0.3);
    camera.position.set(x + Math.sin(clock*0.1)*0.6, OVH+2.6, ez); camera.lookAt(x, 0, d*130); camera.fov = fovFor(48);
  } else if (camMode==='drone'){
    W -= d*14*dt;
    const pt = camera.aspect < 1;
    camera.position.set(Math.sin(clock*0.15)*(pt?10:24), (pt?20:30) + Math.sin(clock*0.2)*4, -d*(pt?40:50)); camera.lookAt(0, 0, d*(pt?40:20)); camera.fov = fovFor(50);
  } else if (camMode==='chase' && chaseCar){
    let ds = chaseCar.s - prevS; if (ds < -HALF) ds += L; if (ds > HALF) ds -= L; prevS = chaseCar.s; W -= d*ds;
    const x = chaseCar.x;
    tmpV.set(x - d*1.5, 4.2, -d*13); camera.position.lerp(tmpV, Math.min(1, dt*4));
    camera.lookAt(x, 1.4, d*20); camera.fov = fovFor(58);
  } else { controls.update(); camera.fov = fovFor(50); }
  camera.updateProjectionMatrix();
  camera.getWorldDirection(tmpV); focus.copy(camera.position).addScaledVector(tmpV, 50); focus.y = 0;
  sun.target.position.copy(focus); sun.position.copy(focus).add(sunOff);
  const sh = world.position.z;
  const near = lampPos.map(p => ({x:p.x, z:p.z+sh})).sort((a,b) => Math.abs(a.z-focus.z) - Math.abs(b.z-focus.z));
  lampLights.forEach((l,i) => { l.position.set(near[i].x*0.9 + bendAt(near[i].z), 10, near[i].z); l.intensity = lampI; });
}
function flash(){
  const ph = Math.floor(clock*5) % 2;
  polRed.emissiveIntensity = ph ? 6 : 0.2; polBlue.emissiveIntensity = ph ? 0.2 : 6;
  const on = Math.floor(clock*1.6) % 2 ? 1.2 : 0.15; for (const m of arrowMats) m.emissiveIntensity = on;
  amberMat.emissiveIntensity = Math.floor(clock*2.4) % 2 ? 3 : 0.3;
}

// ---------- rebuilds ----------
function rebuildTraffic(){
  setupBlocks(); buildZones(); resetRamps(); spawn(); spawnLocals(); bendAll(); applySign();
  for (let i=0; i<300; i++) { sim(1/20); rampStep(1/20); }
  setCam(cfg.cam);
}
function rebuildAll(){ for (const k in IN) delete IN[k]; setupBlocks(); buildWorld(); buildSigns(); tiles.forEach(t => t.gi = null); rebuildTraffic(); }

// ---------- UI ----------
const hud = document.getElementById('hud'), ctrl = document.getElementById('ctrl');
if (!MOBILE) hud.classList.add('open');
document.getElementById('toggle').onclick = () => hud.classList.toggle('open');
renderer.domElement.addEventListener('pointerdown', () => { if (MOBILE && camMode !== 'orbit') hud.classList.remove('open'); });
function rowsSpec(){
  const laneOpts = Array.from({length:LANES}, (_,i) => [i+1, `Lajur ${i+1}`]);
  return [
    ['cam', 'Kamera', [['overpass','Overpass'],['drone','Drone'],['chase','Ikuti mobil'],['works','Pekerjaan jalan'],['ic','Simpang susun'],['orbit','Orbit']]],
    ['dir', 'Arah', [[-1,'Jakarta → Cikampek'],[1,'Cikampek → Jakarta']]],
    ['lanes', 'Lajur tol', [[4,'4 per arah'],[5,'5 per arah']]],
    ['den', 'Lalu lintas', [[0.6,'Sepi'],[1,'Normal'],[1.7,'Padat'],[2.6,'Macet']]],
    ['tod', 'Waktu', [['day','Siang'],['dusk','Senja'],['night','Malam']]],
    ['close:-1', 'Tutup lajur · ke Cikampek', laneOpts, true],
    ['close:1', 'Tutup lajur · ke Jakarta', laneOpts, true],
    ['cf', 'Contraflow', [[0,'Mati'],[-1,'Untuk ke Cikampek'],[1,'Untuk ke Jakarta']]],
    ['cfk', 'Lajur contraflow', Array.from({length:LANES}, (_,i) => [i+1, i+1===LANES ? 'Semua (one way)' : `${i+1} lajur`])],
    ['ovl', 'Jalan overpass', [[1,'1 lajur'],[2,'2 lajur'],[3,'3 lajur'],[4,'4 lajur']]],
  ];
}
function btn(text, on){ const b = document.createElement('button'); b.className = 'opt'; b.textContent = text; b.setAttribute('aria-pressed', on ? 'true' : 'false'); return b; }
function renderUI(){
  const sc = ctrl.scrollTop; ctrl.innerHTML = '';
  for (const [id, label, opts, multi] of rowsSpec()) {
    if (id === 'cfk' && !cfg.cf) continue;
    const lbl = document.createElement('div'); lbl.className = 'lbl'; lbl.textContent = label;
    const cell = document.createElement('div'); cell.className = 'cell';
    if (multi) {
      const d = id.split(':')[1], sel = cfg.closed[d] || [];
      opts.forEach(([v, t]) => { const on = sel.includes(v), b = btn(t, on);
        b.disabled = !on && sel.length >= LANES-1;
        b.onclick = () => { cfg.closed[d] = on ? sel.filter(x => x !== v) : [...sel, v]; saveCfg(); renderUI(); rebuildTraffic(); };
        cell.append(b); });
      const h = document.createElement('div'); h.className = 'hint'; h.textContent = 'Lajur 1 = paling kiri. Minimal satu lajur tetap dibuka.'; cell.append(h);
    } else opts.forEach(([v, t]) => { const b = btn(t, String(cfg[id]) === String(v)); b.onclick = () => apply(id, v); cell.append(b); });
    ctrl.append(lbl, cell);
  }
  ctrl.scrollTop = sc;
}
function apply(id, v){
  cfg[id] = v;
  if (id === 'lanes') { LANES = v; for (const d of ['-1','1']) { cfg.closed[d] = (cfg.closed[d]||[]).filter(n => n <= LANES).slice(0, LANES-1); } cfg.cfk = Math.min(cfg.cfk, LANES); }
  saveCfg();
  if (id === 'cam' || id === 'dir') setCam(cfg.cam);
  else if (id === 'tod') setTod(v);
  else if (id === 'lanes' || id === 'ovl') rebuildAll();
  else rebuildTraffic();
  renderUI();
}

try { await Promise.race([document.fonts.load('700 64px Archivo'), new Promise(r => setTimeout(r, 2500))]); } catch(e) {}
camMode = cfg.cam;
window.__fw = {get tiles(){ return tiles; }, camera, controls, setCam: m => { cfg.cam = m; setCam(m); }, get W(){ return W; }, set W(v){ W = v; }};
rebuildAll();
setTod(cfg.tod);
renderUI();

let last = performance.now();
renderer.setAnimationLoop(now => {
  const dt = Math.min(0.05, (now-last)/1000); last = now;
  sim(dt); rampStep(dt); simLocals(dt); updateCam(dt); updateTiles(); place(); flash(); updateBend(); composer.render();
});
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight); });
</script>
</body>
